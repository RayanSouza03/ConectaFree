<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ConectaFree</title>
  <link rel="stylesheet" href="css/login.css">
  <link rel="stylesheet" href="css/menu-lateral.css">
  <link rel="stylesheet" href="css/faq.css">
  <link rel="stylesheet" href="css/tema.css">
  <link rel="stylesheet" href="css/profissional.css">
</head>
<body class="pagina-faq tem-menu" data-menu-ativo="faq.html">

<script src="js/config.js"></script>
<script src="js/authService.js"></script>
<script src="js/api.js"></script>
<script>if (!AuthService.estaAutenticado()) window.location.replace("index.html");</script>
<script src="js/menuLateral.js"></script>

<div class="conteudo-pagina">


  <main class="container-faq">
    <div class="topo-faq">
      <h1 class="titulo-faq">FAQ</h1>
      <div class="busca">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle><line x1="16.5" y1="16.5" x2="21" y2="21"></line>
        </svg>
        <input type="search" id="busca" placeholder="Busque por portfólio, filtros, cadastro..." autocomplete="off" aria-label="Buscar perguntas">
      </div>
    </div>

    <div class="grade-faq">
      <section>
        <p class="rotulo-lista">Digite acima para filtrar, ou clique em uma pergunta para ver a resposta ao lado</p>
        <ul id="lista"></ul>
        <p class="contador" id="contador"></p>
      </section>

      <article class="card-resposta" aria-live="polite">
        <span class="categoria" id="categoria"></span>
        <h2 id="titulo"></h2>
        <div class="divisor"></div>
        <p id="resposta"></p>
        <p class="rodape-card" id="rodape"></p>
      </article>
    </div>
  </main>

  <footer>
    <nav class="rodape-links">
      <a href="#">Sobre</a>
      <a href="#">Ajuda</a>
      <a href="termos.html#privacidade">Privacidade</a>
      <a href="termos.html">Termos</a>
    </nav>
    <div class="rodape-baixo">
      <span>Português (Brasil)</span>
      <span>© 2026</span>
    </div>
  </footer>

</div>

  <script src="js/faq.js"></script>
  <script src="js/tema.js"></script>
</body>
</html>
