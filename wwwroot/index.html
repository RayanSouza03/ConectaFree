<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ConectaFree</title>
  <link rel="stylesheet" href="css/styles.css">
  <!-- Caminhos relativos: como o index.html está na raiz de wwwroot,
       "css/..." e "js/..." já apontam certo, sem precisar de ~/ (isso é sintaxe Razor/MVC, não se aplica aqui). -->
</head>
<body>

  <div class="paineis">

    <section class="lado-esquerdo">
      <div class="conteudo-esquerdo">
        <h1 class="titulo">
          Encontre e anuncie seus serviços
        </h1>

        <div class="imagem-central">
          <!--
            Campo de imagem central.
            Para usar, cole a URL da imagem no atributo src abaixo.
            Ex: <img id="imagem-hero" src="https://exemplo.com/minha-imagem.png" alt="Imagem de destaque">
          -->
          <img id="imagem-hero" class="imagem-hero" src="https://github.com/Mosselin/imagens-conectafree/blob/main/imagem-centro.png?raw=true" alt="Imagem de destaque">
        </div>
      </div>
    </section>

    <section class="lado-direito">
      <div class="conteudo-direito">
        <form id="form-login" novalidate>
          <p class="rotulo-entrar">Entrar no ConectaFree</p>

          <div class="campo-usuario-senha">
            <input type="text" id="usuario" name="usuario" placeholder="email" autocomplete="username" required>
            <input type="password" id="senha" name="senha" placeholder="Senha" autocomplete="current-password" required>
          </div>

          <p id="mensagem-erro" class="mensagem-erro" role="alert"></p>

          <div class="acoes-form">
            <button type="submit" id="btn-entrar" class="btn-entrar">Entrar</button>
            <a href="#" class="link-esqueceu">Esqueceu a senha?</a>
          </div>
        </form>

        <div class="acoes-alternativas">
          <button type="button" class="btn-google">
            <svg width="18" height="18" viewBox="0 0 48 48">
              <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.6 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.2-.1-2.4-.4-3.5z"/>
              <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
              <path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.3-5.1l-6.6-5.4C29.6 35.5 26.9 36 24 36c-5.3 0-9.7-3.4-11.3-8.1l-6.6 5.1C9.6 39.6 16.3 44 24 44z"/>
              <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.7l6.6 5.4C41.6 35.6 44 30.2 44 24c0-1.2-.1-2.4-.4-3.5z"/>
            </svg>
            Entrar com o Google
          </button>
          <button type="button" class="btn-criar-conta">Criar nova conta</button>
        </div>

        <p class="marca-conecta">Conectafree</p>
      </div>
    </section>

  </div>

  <footer>
    <nav class="rodape-links">
      <a href="#">Sobre</a>
      <a href="#">Ajuda</a>
      <a href="#">Privacidade</a>
      <a href="#">Termos</a>
    </nav>
    <div class="rodape-baixo">
      <span>Português (Brasil)</span>
      <span>© 2026</span>
    </div>
  </footer>



  <script src="js/config.js"></script>
  <script src="js/authService.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
