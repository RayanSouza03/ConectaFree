<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ConectaFree</title>
  <link rel="stylesheet" href="css/login.css">
  <link rel="stylesheet" href="css/tema.css">
  <link rel="stylesheet" href="css/profissional.css">
  <link rel="stylesheet" href="css/termos.css">

</head>
<body>



  <div class="paineis">

    <section class="lado-esquerdo">
      <div class="conteudo-esquerdo">
        <h1 class="titulo">
          Encontre e anuncie seus <span class="dest">serviços</span>
        </h1>

        <div class="imagem-central">
          <img id="imagem-hero" class="imagem-hero" src="img/imagem-centro.png" alt="Imagem de destaque">
        </div>
      </div>
    </section>

    <section class="lado-direito">
      <div class="conteudo-direito">
        <form id="form-login" novalidate>
          <p class="rotulo-entrar">Entrar no ConectaFree</p>

          <div class="campo-usuario-senha">
            <input type="text" id="usuario" name="usuario" placeholder="email" autocomplete="username" required>
            <input type="password" id="senha" name="senha" placeholder="Senha" autocomplete="current-password" required>
          </div>

          <p id="mensagem-erro" class="mensagem-erro" role="alert"></p>

          <div class="acoes-form">
            <button type="submit" id="btn-entrar" class="btn-entrar">Entrar</button>
            <a href="recuperar-senha.html" class="link-esqueceu">Esqueceu a senha?</a>
          </div>
        </form>

        <div class="acoes-alternativas">
          <!-- Botão oficial do Google Identity Services (aparece quando Google:ClientId está configurado) -->
          <div class="area-google" id="area-google" hidden>
            <div id="google-btn"></div>
          </div>
          <a href="cadastro.html" class="btn-criar-conta">Criar nova conta</a>
        </div>

        <p class="marca-conecta">ConectaFree</p>
      </div>
    </section>

  </div>

  <footer>
    <nav class="rodape-links">
      <a href="#">Sobre</a>
      <a href="#">Ajuda</a>
      <a href="termos.html#privacidade">Privacidade</a>
      <a href="termos.html">Termos</a>
    </nav>
    <div class="rodape-baixo">
      <span>Português (Brasil)</span>
      <span>© 2026</span>
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/authService.js"></script>
  <script src="js/termos.js"></script>
  <script src="js/login.js"></script>
  <script src="js/tema.js"></script>
</body>
</html>
